<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#0F1C3F"/>
      <stop offset="100%" stop-color="#152A4E"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="1.6" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- outer border -->
  <rect x="0" y="0" width="1200" height="300" rx="18" fill="#3A9BDC"/>
  <!-- inner background -->
  <rect x="6" y="6" width="1188" height="288" rx="14" fill="url(#bg)"/>
  <!-- dotted texture -->
  <rect x="6" y="6" width="1188" height="288" rx="14" fill="url(#dots)"/>

  <!-- subtitle -->
  <text x="70" y="120" font-family="Segoe UI, Verdana, sans-serif" font-size="30" fill="#5FB4EA">
    Software Developer
  </text>

  <!-- main title -->
  <text x="70" y="185" font-family="Segoe UI, Verdana, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">
    Hüseyin Özgür Sencar
  </text>

  <!-- tagline -->
  <text x="70" y="230" font-family="Segoe UI, Verdana, sans-serif" font-size="22" fill="#C7D2E8">
    C# · .NET  · ASP.NET Core &amp; MVC · SQL Server &amp; Oracle
  </text>
</svg>
